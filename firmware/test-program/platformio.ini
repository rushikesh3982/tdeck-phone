; T-Deck phone: test program. Build and load with PlatformIO (see README.md).
;
; The T-Deck: ESP32-S3, 16 MB flash, 8 MB PSRAM (octal), USB-C as a serial port. The platform version is the one
; LilyGO's own T-Deck examples are built with (github.com/Xinyuan-LilyGO/T-Deck, platformio.ini).

[env:t-deck]
platform = espressif32@6.3.0
board = esp32-s3-devkitc-1
framework = arduino
; The Arduino framework itself (2.0.9, the version this platform uses), from Espressif's own release on GitHub:
; PlatformIO's download servers kept stalling on it (13 Nov 2026), while GitHub's is quick and resumes.
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/2.0.9/esp32-2.0.9.zip
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
upload_speed = 921600
monitor_speed = 115200
; Enter sends CR, as the modem expects. No local echo: the modem repeats what is typed (ATE1)
monitor_eol = CR

lib_deps =
    bodmer/TFT_eSPI@2.5.43

build_flags =
    -DBOARD_HAS_PSRAM
    ; USB-C is the serial port the Mac's terminal talks to
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; The display, set here instead of in TFT_eSPI's own files (LilyGO's Setup210_LilyGo_T_Deck.h)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=1
    -DTFT_MISO=38
    -DTFT_MOSI=41
    -DTFT_SCLK=40
    -DTFT_CS=12
    -DTFT_DC=11
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DDISABLE_ALL_LIBRARY_WARNINGS
